# Deploys the tide forecast service.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - 'internal/**'

env:
  GO_VERSION: "1.24"
  REPLICAS: 3
  DEBUG: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/tide ./cmd/tide
          echo "built ${GITHUB_SHA}"
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        with:
          station: &default-station abc-01
          fallback: *default-station
          limits: { cpu: 500m, memory: 128Mi }
        run: ./deploy.sh --replicas=${{ env.REPLICAS }}
